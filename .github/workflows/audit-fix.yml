# One-time helper: applies non-breaking npm audit fixes only if tests and build
# still pass, commits the lockfile, and reports what's left as annotations.
name: Audit fix

on:
  push:
    paths: [".github/workflows/audit-fix.yml"]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm audit --json > /tmp/before.json || true
      - run: npm audit fix --no-fund || true
      - run: npm audit --json > /tmp/after.json || true
      - name: Report
        run: |
          node -e '
            const fs = require("fs");
            for (const f of ["before", "after"]) {
              const a = JSON.parse(fs.readFileSync(`/tmp/${f}.json`, "utf8"));
              const rows = Object.values(a.vulnerabilities || {}).map(v => {
                const fix = v.fixAvailable === true ? "fix: yes"
                  : v.fixAvailable ? `fix: ${v.fixAvailable.name}@${v.fixAvailable.version}${v.fixAvailable.isSemVerMajor ? " (MAJOR)" : ""}`
                  : "fix: none";
                return `${v.severity.toUpperCase()} ${v.name} (${v.range}) direct=${v.isDirect} ${fix}`;
              });
              const msg = (`${f}: ` + JSON.stringify(a.metadata?.vulnerabilities) + "\n" + rows.join("\n")).replace(/%/g, "%25").replace(/\n/g, "%0A");
              console.log(`::warning title=audit ${f}::${msg}`);
            }'
      - name: Verify
        run: npm test && npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Apply non-breaking npm audit fixes" || echo "no changes"
          git push
